# ==================================================
# Application
# ==================================================
spring.application.name=audit-service
server.port=8082


# ==================================================
# Database
# ==================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/starterkit
spring.datasource.username=sa
spring.datasource.password=sa


# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=audit


# ==================================================
# Flyway
# ==================================================
spring.flyway.enabled=true
spring.flyway.default-schema=audit
spring.flyway.schemas=audit


# ==================================================
# RabbitMQ
# ==================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# ==================================================
# Swagger
# ==================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false


# ==================================================
# Log
# ==================================================
logging.level.com.starterkit.audit=INFO
logging.level.org.springframework.amqp=INFO
