# ==================================================
# Application
# ==================================================
spring.application.name=audit-service
server.port=8082


# ==================================================
# Database
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/starterkit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sa}


# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=audit


# ==================================================
# Flyway
# ==================================================
spring.flyway.enabled=true
spring.flyway.default-schema=audit
spring.flyway.schemas=audit


# ==================================================
# RabbitMQ
# ==================================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin}

# Consumer-side retry with exponential backoff.
# After max-attempts failures, the message is rejected and routed to
# the dead-letter exchange (configured on audit.auth.events and
# audit.gateway.events queues).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

# Do not requeue after retries are exhausted; route to DLX instead.
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# ==================================================
# Swagger
# ==================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false


# ==================================================
# Log
# ==================================================
logging.level.com.starterkit.audit=INFO
logging.level.org.springframework.amqp=INFO


# ==================================================
# JWT (verify tokens issued by auth-service)
# ==================================================
jwt.public-key-path=classpath:keys/jwt-public.pem
jwt.issuer=starterkit-auth
jwt.audience=starterkit-services
