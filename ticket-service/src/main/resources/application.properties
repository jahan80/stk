# ==================================================
# Application
# ==================================================
spring.application.name=ticket-service
server.port=8084

# ==================================================
# Database
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/starterkit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sa}

# ==================================================
# JPA
# ==================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=ticket
spring.jpa.open-in-view=false

# ==================================================
# Flyway
# ==================================================
spring.flyway.enabled=true
spring.flyway.default-schema=ticket
spring.flyway.schemas=ticket

# ==================================================
# RabbitMQ
# ==================================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin}

# ==================================================
# JWT
# ==================================================
jwt.public-key-path=classpath:keys/jwt-public.pem
jwt.issuer=starterkit-auth
jwt.audience=starterkit-services

# ==================================================
# Swagger
# ==================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==================================================
# Logging
# ==================================================
logging.level.com.starterkit.ticket=INFO
