# ==================================================
# Application
# ==================================================
spring.application.name=notif-service
server.port=8083


# ==================================================
# Database
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/starterkit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sa}


# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=notif


# ==================================================
# Flyway
# ==================================================
spring.flyway.enabled=true
spring.flyway.default-schema=notif
spring.flyway.schemas=notif


# ==================================================
# RabbitMQ
# ==================================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin}

# Consumer-side retry with exponential backoff.
# After max-attempts failures, the message is rejected and routed to
# the dead-letter queue (configured on the notif.events queue).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

# Do not requeue after retries are exhausted; route to DLX instead.
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# ==================================================
# Swagger
# ==================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false


# ==================================================
# Provider Configuration
# ==================================================
# mock | smtp
notif.provider.sms=mock
notif.provider.email=${NOTIF_EMAIL_PROVIDER:mock}
notif.provider.push=mock


# ==================================================
# SMTP Configuration (used when notif.provider.email=smtp)
# ==================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# From address
notif.email.from=${NOTIF_EMAIL_FROM:baranteenco@gmail.com}


# ==================================================
# Log
# ==================================================
logging.level.com.starterkit.notif=INFO
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.mail=INFO
