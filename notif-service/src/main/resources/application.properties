# ==================================================
# Application
# ==================================================
spring.application.name=notif-service
server.port=8083


# ==================================================
# Database
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/starterkit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sa}


# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=notif


# ==================================================
# Flyway
# ==================================================
spring.flyway.enabled=true
spring.flyway.default-schema=notif
spring.flyway.schemas=notif


# ==================================================
# RabbitMQ
# ==================================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin}
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# ==================================================
# Swagger
# ==================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false


# ==================================================
# Provider Configuration
# ==================================================
notif.provider.sms=mock
notif.provider.email=mock
notif.provider.push=mock


# ==================================================
# Log
# ==================================================
logging.level.com.starterkit.notif=INFO
logging.level.org.springframework.amqp=INFO
