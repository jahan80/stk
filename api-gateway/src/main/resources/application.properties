# ==================================================
# Application
# ==================================================
spring.application.name=api-gateway
server.port=8080


# ==================================================
# Database
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/starterkit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sa}


# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=gateway
spring.jpa.open-in-view=false


# ==================================================
# Flyway
# ==================================================
spring.flyway.enabled=true
spring.flyway.default-schema=gateway
spring.flyway.schemas=gateway


# ==================================================
# Routes
# ==================================================
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=audit-service
spring.cloud.gateway.server.webflux.routes[1].uri=${AUDIT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/audit/**

spring.cloud.gateway.server.webflux.routes[2].id=notif-service
spring.cloud.gateway.server.webflux.routes[2].uri=${NOTIF_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/notify/**


# ==================================================
# RabbitMQ
# ==================================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin}


# ==================================================
# JWT
# ==================================================
jwt.public-key-path=classpath:keys/jwt-public.pem
jwt.issuer=starterkit-auth
jwt.audience=starterkit-services


# ==================================================
# Rate Limit Fallback Defaults
# ==================================================
gateway.rate-limit.default.requests-per-window=100
gateway.rate-limit.default.window-seconds=60
gateway.rate-limit.default.enabled=true
gateway.rate-limit.cache-ttl-seconds=60
gateway.rate-limit.include-headers=true


# ==================================================
# Cache
# ==================================================
spring.cache.type=caffeine


# ==================================================
# Logging
# ==================================================
logging.level.com.starterkit.gateway=INFO
logging.level.org.springframework.cloud.gateway=INFO


# ==================================================
# Ticket Service
# ==================================================
spring.cloud.gateway.server.webflux.routes[3].id=ticket-service
spring.cloud.gateway.server.webflux.routes[3].uri=${TICKET_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/tickets/**


# ==================================================
# Rate Limit - Trust Proxy
# ==================================================
# false (default): safe when gateway is internet-facing.
# true: only when a trusted proxy (LB/Nginx/Cloudflare) is in front.
gateway.rate-limit.trust-proxy=false


# ==================================================
# Rate Limit - Fail-open Policy
# ==================================================
# true  (default): DB down → allow request (availability)
# false:           DB down → reject with 503 (security)
gateway.rate-limit.fail-open=true

# ==================================================
# Gateway Event Publishing
# ==================================================
# async (default) -> bounded queue + worker thread
# sync            -> blocking publish on request thread (dev only)
gateway.events.publisher=async
gateway.events.queue-capacity=10000
